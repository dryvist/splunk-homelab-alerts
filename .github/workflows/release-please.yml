name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: dryvist/.github/.github/workflows/_release-please.yml@main
    with:
      runner_label: ubuntu-24.04
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}

  # release-please creates the release as a draft (release-please-config.json).
  # Attach the tarball first, then publish: a published release is immutable.
  package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # A called workflow cannot exceed the caller's grant; the workflow default
    # here is none, so the package job must grant what the reusable requests.
    permissions:
      contents: write
    uses: ./.github/workflows/package-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  publish:
    needs: [release-please, package]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write

      # The App token, not GITHUB_TOKEN: publishing with GITHUB_TOKEN emits no
      # `release: published` event for downstream `on: release` workflows.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # No checkout in this job, so gh cannot infer the repo from a git remote.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "${TAG_NAME}" --draft=false
