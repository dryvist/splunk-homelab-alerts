name: Release

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  release:
    uses: JacobPEvans/.github/.github/workflows/_release.yml@v1
    with:
      runner_label: ubuntu-24.04
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: read


  # release-please creates the release as a draft (release-please-config.json).
  # Attach the tarball first, then publish: a published release is immutable.
  package:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    # A called workflow cannot exceed the caller's grant; the workflow default
    # here is none, so the package job must grant what the reusable requests.
    permissions:
      contents: write
    uses: ./.github/workflows/package-release.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}


  publish:
    needs: [release, package]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write

      # The App token, not GITHUB_TOKEN: publishing with GITHUB_TOKEN emits no
      # `release: published` event for downstream `on: release` workflows.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # No checkout in this job, so gh cannot infer the repo from a git remote.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: gh release edit "${TAG_NAME}" --draft=false
