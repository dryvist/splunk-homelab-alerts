[install]
is_configured = 1
state = enabled

[ui]
is_visible = 1
label = Homelab Alerts

[launcher]
author = homelab
description = Deterministic homelab detectors, delivered to Slack and Zammad by default
# Splunk's .conf parser takes an inline "# comment" as part of the value
# (comments must be a whole line, or the version string breaks), so the
# release-please marker goes on its own line above.
# x-release-please-version
version = 0.1.0
