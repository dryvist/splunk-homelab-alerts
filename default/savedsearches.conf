[unifi_silence_detector]
description = Alerts when the unifi index has received no events for more than 15 minutes. Catches the emitter, its Cribl pipeline, and Splunk HEC ingestion failing with a single signal.
search = | tstats count as event_count latest(_time) as last_seen WHERE index=unifi | appendpipe [ stats count as _rows | where _rows == 0 | eval last_seen = 0, event_count = 0 | fields - _rows ] | eval minutes_silent = (now() - coalesce(last_seen, 0)) / 60 | where minutes_silent > 15
# Lookback derives from this detector's own threshold (not a flat constant
# shared by every detector regardless of cadence): wide enough that a host
# silent for many multiples of its own threshold is still inside the window.
# tstats reads only indexed metadata, so a wide window is cheap. This does
# NOT make the window unbounded — a host silent longer than this still has no
# row for tstats to return at all (the same inherent gap the "zero events in
# the whole index" case above closes only for the fully-empty-index case).
# Closing that class fully needs comparing against the full host roster
# (an inventory-diff detector), not a wider tstats lookback; out of scope here.
dispatch.earliest_time = -30000m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
is_visible = 1
disabled = 1
alert.severity = 3
alert.suppress = 1
alert.suppress.period = 60m
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0

[os_silence_detector]
description = Alerts when the os index has received no events for more than 15 minutes, detected per-host against each host's own cadence so a healthy emitter cannot mask a dead one. Catches the emitter, its Cribl pipeline, and Splunk HEC ingestion failing with a single signal.
search = | tstats count as event_count latest(_time) as last_seen earliest(_time) as first_seen WHERE index=os by host | appendpipe [ stats count as _rows | where _rows == 0 | eval host = "(no hosts reporting)", last_seen = 0, first_seen = 0, event_count = 0 | fields - _rows ] | eval avg_gap_minutes = if(event_count > 1, (last_seen - first_seen) / 60 / (event_count - 1), null()) | eval host_threshold_minutes = case(true(), max(coalesce(avg_gap_minutes, 0) * 4, 15)) | eval minutes_silent = (now() - coalesce(last_seen, 0)) / 60 | where minutes_silent > host_threshold_minutes
# Lookback derives from this detector's own threshold (not a flat constant
# shared by every detector regardless of cadence): wide enough that a host
# silent for many multiples of its own threshold is still inside the window.
# tstats reads only indexed metadata, so a wide window is cheap. This does
# NOT make the window unbounded — a host silent longer than this still has no
# row for tstats to return at all (the same inherent gap the "zero events in
# the whole index" case above closes only for the fully-empty-index case).
# Closing that class fully needs comparing against the full host roster
# (an inventory-diff detector), not a wider tstats lookback; out of scope here.
dispatch.earliest_time = -30000m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
is_visible = 1
disabled = 1
alert.severity = 3
alert.suppress = 1
alert.suppress.period = 60m
# Scope suppression per host: without this, the first silent host suppresses
# the alert globally and a second host failing inside the window goes unseen.
alert.suppress.fields = host
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0

