# Delivery defaults for every saved search in THIS app.
#
# savedsearches.conf has no prefix-based stanza inheritance: a stanza named
# `[HomelabAlert - foo]` inherits nothing from a `[HomelabAlert]` stanza.
# Verified against Splunk 10.2.0 -- a child stanza read back the global default
# severity and an empty cron. `[default]` is the only inheritance mechanism the
# file has, and it is scoped to the app that declares it: a `[default]` in a
# throwaway app reached its own searches and none of the 787 owned by the other
# 24 apps on the instance.
#
# So the `HomelabAlert - ` prefix below is organizational, not mechanical. It
# groups alerts in the UI and -- because the stanza name is the Zammad ticket
# title -- namespaces Splunk's incidents away from the ones Hermes opens.
#
# Detectors live in ansible-splunk's homelab_alerts app today. They migrate
# here one at a time; each arrives `disabled = 1` and is enabled in its own
# reviewed change.
[default]
enableSched = 1
alert.track = 1
# Spread scheduled dispatch instead of stacking every alert on the same minute.
allow_skew = 15m
# Nothing dispatches until a detector is explicitly promoted.
disabled = 1

action.zammad = 1
action.zammad.param.group = Homelab Infrastructure
action.zammad.param.priority = 2 normal
action.zammad.param.state = new
# The stanza name is unique and stable across every firing, so it is both the
# ticket title and the dedup key: a detector on a */5 cron appends to one open
# ticket instead of opening one per cycle. Override per-search (for example
# `$name$ - $result.host$`) when one detector should open a ticket per host.
action.zammad.param.correlation_key = $name$

# --- OpenBao security/availability detectors -------------------------------
#
# All four watch index=openbao_audit (audit-device JSON, auto-extracted
# fields -- no spath needed: type, auth.policies{}, auth.token_type,
# request.path, request.operation) or index=openbao (voter-health sampler,
# sourcetype=openbao:voter:health) except where noted. Each arrives disabled
# via the app's [default] stanza (disabled = 1) and is enabled in its own
# reviewed change, same as every other detector in this app.

[HomelabAlert - openbao privileged use]
description = A request used a privileged policy (ai-admin/root), wrote to a \
    sensitive sys path (policies, audit, mounts, an AppRole role definition), \
    or called generate-root/rekey. Any one hit is an incident on its own --  \
    this is not a threshold detector.
# auth.policies{} is a JSON array; mvjoin + match() avoids a per-policy `IN`
# list that would need updating every time a policy is renamed. request.path
# is matched by prefix (`^`) rather than exact-value, because the sensitive
# stanzas below (sys/policies/<name>, auth/approle/role/<name>) are each a
# family of paths, not one literal path.
search = index=openbao_audit type=request \
    | eval policies=mvjoin('auth.policies{}', ",") \
    | eval is_privileged_policy=if(match(policies, "(^|,)(ai-admin|root)(,|$)"), 1, 0) \
    | eval is_sensitive_write=if(match('request.operation', "^(create|update|delete)$") AND match('request.path', "^(sys/policies/|sys/audit|sys/mounts|auth/approle/role/)"), 1, 0) \
    | eval is_dangerous_path=if(match('request.path', "^sys/(generate-root|rekey)"), 1, 0) \
    | where is_privileged_policy=1 OR is_sensitive_write=1 OR is_dangerous_path=1 \
    | eval reason=case(is_privileged_policy=1, "privileged policy (ai-admin/root)", is_dangerous_path=1, "generate-root/rekey", is_sensitive_write=1, "write to sensitive sys path") \
    | table _time, host, 'auth.token_type', reason, policies, 'request.path', 'request.operation'
# Real-time-ish: a 5-minute cron with a 6-minute lookback overlaps by a full
# minute so a request landing right at a cycle boundary is never skipped.
dispatch.earliest_time = -6m
dispatch.latest_time = now
cron_schedule = */5 * * * *
alert.severity = 4
counttype = number of events
relation = greater than
quantity = 0

[HomelabAlert - openbao snapshot deadman]
description = No "snapshot OK" line has appeared from the openbao-snapshot \
    systemd timer in over 7 hours (default interval is much shorter -- see \
    ansible-secrets-management roles/openbao/templates/openbao-snapshot.sh.j2, \
    which logs `log "snapshot OK: ${snap} (${size} bytes)"` via \
    `logger -t openbao-snapshot`, journald-harvested into index=os same as \
    every other host). Only the Raft LEADER runs the timer body, so this \
    detector is host-agnostic (openbao-* wildcard) rather than per-host: a \
    leadership failover moving which node logs the marker is not itself a \
    failure.
# `| stats count | where count=0` is the silence-safe idiom this repo's task
# spec calls for: an ungrouped `stats count` always emits exactly one row
# (count=0 on an empty result set), unlike a bare `search | where count=0`
# which never runs `where` against zero input rows and so can never fire.
search = index=os host=openbao-* "openbao-snapshot" "snapshot OK" \
    | stats count \
    | where count=0
dispatch.earliest_time = -7h
dispatch.latest_time = now
cron_schedule = */30 * * * *
alert.severity = 3
counttype = number of events
relation = greater than
quantity = 0

[HomelabAlert - openbao reconcile deadman]
description = No successful reconcile/export event in over 26 hours. \
    ASSUMPTION (documented per task spec, not yet verified live in Splunk): \
    no reconcile emitter with a Splunk-visible success marker was found --  \
    only an `openbao-reconcile` OpenBao policy/AppRole exists today \
    (ansible-secrets-management and ansible-proxmox-apps \
    roles/openbao/templates/openbao-reconcile-policy.hcl.j2). This search \
    assumes the reconcile job will adopt the same `logger -t \
    openbao-reconcile "reconcile OK"` -> journald -> index=os convention as \
    the sibling openbao-snapshot/openbao-voter-health timers when it ships. \
    Until that emitter exists this detector fires continuously (an accurate \
    silence signal, not a false positive) -- ship it disabled until the \
    reconcile job's logging lands, then flip disabled=0 in that change.
search = index=os host=openbao-* "openbao-reconcile" "reconcile OK" \
    | stats count \
    | where count=0
dispatch.earliest_time = -26h
dispatch.latest_time = now
cron_schedule = 0 */2 * * *
alert.severity = 3
counttype = number of events
relation = greater than
quantity = 0

[HomelabAlert - openbao raft quorum]
description = Fewer than 9 Raft voters answered healthy (state active or \
    standby, i.e. reachable and not sealed/uninitialized/unreachable) in the \
    last 15 minutes. Source: the voter-health sampler \
    (ansible-secrets-management roles/openbao/templates/openbao-voter-health.sh.j2), \
    which ships one event per voter per 5-minute cycle to \
    index=openbao sourcetype=openbao:voter:health with fields voter, \
    http_code, health_state, is_self. No existing estate detector counts \
    voters -- the only prior openbao_voter_health entry \
    (ansible-splunk roles/splunk_docker/defaults/main/11-silence-detectors.yml) \
    is a silence detector for the SAMPLER itself, not a quorum-count \
    threshold; this is a new, distinct signal.
# Distinct count of healthy voters is silence-safe on its own: an ungrouped
# `stats dc(...)` still returns one row (healthy_voters=0) when nothing
# reachable shipped an event, which is exactly the "below 9" case -- no
# separate appendpipe guard needed.
search = index=openbao sourcetype="openbao:voter:health" \
    | where health_state!="unreachable" AND health_state!="unknown" \
    | stats dc(voter) as healthy_voters \
    | where healthy_voters < 9
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
alert.severity = 4
[HomelabAlert - agent transcript secret residue]
description = A credential-shaped string reached an AI coding-agent index. \
    Those indexes are fed through a Cribl Stream destination post-processing \
    pipeline whose Mask function replaces these same patterns with REDACTED, \
    so a hit means the redaction did not apply: the pipeline is detached from \
    a destination, a new field nests deeper than the configured depth, or the \
    credential has a shape no rule covers. Treat every hit as an exposure -- \
    rotate the credential first, then fix the rule.
# The regex alternation is the same rule set the redaction pipeline masks, so
# the detector and the pipeline drift together or not at all. It runs against
# _raw, which carries the serialized event including nested fields.
#
# The result set is deliberately an aggregate: matching values are counted, not
# returned. A detector that echoed the matched substring would copy the
# credential into the alert payload and from there into the incident body,
# recreating the exposure it exists to report.
search = index=claude OR index=codex OR index=ai_usage \
    | regex _raw="(dp\.(st|ct|pt|sa)\.[A-Za-z0-9_-]+|hv[sb]\.[A-Za-z0-9_-]{20,}|\bs\.[A-Za-z0-9]{24}\b|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|xox[abpsr]-[A-Za-z0-9-]{10,}|Bearer\s+[A-Za-z0-9._~+/-]{20,}={0,2}|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----)" \
    | stats count by index, sourcetype, host
# Hourly with a 70-minute lookback: the overlap covers the 15m allow_skew the
# app's [default] stanza applies, so an event landing near a cycle boundary is
# never skipped.
dispatch.earliest_time = -70m@m
dispatch.latest_time = now
cron_schedule = 17 * * * *
alert.severity = 4

[HomelabAlert - Proxmox node sustained I/O pressure]
description = A Proxmox node's I/O pressure-stall average (psi_io_avg60, from \
    pve-health) has been over 25% for its last 3 consecutive samples (~3 min \
    at the ~60s emit cadence). Sustained I/O pressure is the earliest visible \
    symptom of a saturated backing disk -- this is what a full/fragmented ZFS \
    pool looks like from the node's own scheduler before the pool itself is \
    ever queried.
# The event is syslog-wrapped: sourcetype=pve:health is set, but the
# key=value pairs sit in _raw and are not field-extracted, so a bare
# `psi_io_avg60=*` search matches nothing and reads exactly like "no such
# field" -- rex pulls it out below. "3 consecutive samples" is read literally
# as the 3 most recent events for that host, not a fixed time window, so a
# slow or delayed emitter does not silently satisfy the condition with fewer
# than 3 real samples -- `where samples>=3` guards that.
search = index=os_proxmox sourcetype=pve:health \
    | rex field=_raw "psi_io_avg60=(?<psi_io_avg60>[\d.]+)" \
    | sort 0 host, -_time \
    | streamstats count AS sample_n BY host \
    | where sample_n<=3 \
    | stats count AS samples, count(eval(psi_io_avg60>25)) AS high_samples, latest(psi_io_avg60) AS latest_psi_io_avg60, latest(_time) AS latest_time BY host \
    | where samples>=3 AND high_samples=3 \
    | eval latest_time=strftime(latest_time, "%Y-%m-%d %H:%M:%S") \
    | table host, latest_psi_io_avg60, latest_time, samples
dispatch.earliest_time = -6m
dispatch.latest_time = now
cron_schedule = */5 * * * *
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = host
counttype = number of events
relation = greater than
quantity = 0

# --- Native burst and silence detectors ---
# Silence searches use indexed metadata and shared threshold/cadence macros.
# Per-host searches retain hosts within each dispatch lookback; an empty index
# produces a sentinel result. Hosts outside retention require an inventory.
# All packaged detectors remain disabled until explicitly enabled.

[openbao_ingress_backend_burst_detector]
description = Counts HTTP 502/503 responses for the OpenBao ingress service in each scheduled five-minute window.
search = index=proxy sourcetype=traefik:syslog "openbao@file" \
    | rex field=_raw "\"(?:GET|POST|PUT|DELETE|HEAD|OPTIONS|PATCH) \S+ HTTP/\S+\" (?<status>\d{3})" \
    | rex field=_raw "\"(?<service_name>[^\"]+)\" \"[^\"]+\" \S+\s*$" \
    | where service_name="openbao@file" AND in(status, "502", "503") \
    | stats count as burst_count \
    | where burst_count >= `homelab_backend_burst_threshold`
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = */5 * * * *
allow_skew = 0
enableSched = 1
is_visible = 1
disabled = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 15m
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0

