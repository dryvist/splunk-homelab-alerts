[homelab_index_silence(2)]
args = index, minutes
definition = tstats count as event_count max(_time) as last_seen WHERE index=$index$ \
    | stats sum(event_count) as event_count max(last_seen) as last_seen \
    | eval event_count=coalesce(event_count, 0), threshold_minutes=$minutes$, minutes_silent=(now()-coalesce(last_seen, 0))/60 \
    | where minutes_silent > threshold_minutes
iseval = false

[homelab_host_silence(2)]
args = index, minutes
definition = tstats count as event_count min(_time) as first_seen max(_time) as last_seen WHERE index=$index$ BY host \
    | appendpipe [ stats count as reporting_hosts | where reporting_hosts=0 | eval host="(no hosts reporting)", event_count=0, first_seen=0, last_seen=0 | fields - reporting_hosts ] \
    | eval avg_gap_minutes=if(event_count>1, (last_seen-first_seen)/60/(event_count-1), 0) \
    | eval host_threshold_minutes=max(avg_gap_minutes*`homelab_silence_cadence_multiplier`, $minutes$), minutes_silent=(now()-last_seen)/60 \
    | where minutes_silent > host_threshold_minutes
iseval = false

[homelab_os_log_indexes]
definition = (index=os OR index=os_proxmox OR index=os_ai)
iseval = false

# Keep the index and service filter in one place while indexed JSON extraction
# is confirmed.
[homelab_local_agent_events]
definition = index=ai_usage sourcetype="otel:log" "resource.attributes.service.name"="local-agent"
iseval = false

# Hermes cron scheduler lines arrive in index=hermes as raw message text.
# One keyword filter for every cron run and delivery search.
[homelab_hermes_cron_events]
definition = index=hermes ("Running job" OR "completed successfully" OR "failed:" \
    OR "delivered to" OR "delivery suppressed")
iseval = false

# One rex per line type. The quoting is the discriminator: run lines quote the
# job NAME with no colon right after the closing quote ("Running job '<name>'
# (ID: <id>)", "Job '<name>' completed successfully", "Job '<name>' failed:"),
# delivery lines quote the job ID followed by a colon ("Job '<id>': delivered
# to <platform>:<chat_id>", "Job '<id>': delivery to <where> failed:"), and the
# homelab suppression patch quotes the name before its "delivery suppressed"
# marker. Keep every pattern here so a scheduler wording change is one edit.
[homelab_hermes_cron_fields]
definition = rex field=_raw "Running job '(?<cron_start_name>[^']+)' \(ID: (?<cron_start_id>[^\)]+)\)" \
    | rex field=_raw "Job '(?<cron_success_name>[^']+)' completed successfully" \
    | rex field=_raw "Job '(?<cron_fail_name>[^']+)' failed:" \
    | rex field=_raw "Job '(?<cron_delivered_id>[^']+)': delivered to " \
    | rex field=_raw "Job '(?<cron_delivery_failed_id>[^']+)': delivery to .* failed:" \
    | rex field=_raw "Job '(?<cron_suppressed_name>[^']+)':.*delivery suppressed"
iseval = false

# MLX cluster guard lines arrive in index=llm as raw text. Hold lines carry
# both guard=<G> and decision=hold; refusal lines carry only REFUSE reason=<R>,
# so decision and guard are filled in for them -- a refusal is a decision, and
# its guard is not named on the line. Keep every pattern here so a scheduler
# wording change is one edit, shared by the alert and its dashboard.
[homelab_mlx_cluster_fields]
definition = rex field=_raw "guard=(?<guard>\S+)" \
    | rex field=_raw "decision=(?<decision>\S+)" \
    | rex field=_raw "reason=(?<reason>\S+)" \
    | eval guard=coalesce(guard, "unknown"), decision=coalesce(decision, "refuse"), reason=coalesce(reason, "unspecified")
iseval = false

# Backup systemd units, defined once by cadence. Every backup alert uses these
# shared families so an added unit is checked for both failures and silence.
[homelab_daily_backup_units]
definition = ("restic-backup@" OR "nautobot-backup@" OR "homebox-backup@" \
    OR "pg-backup.service" OR "pgbackrest-backup@incr.service" \
    OR "postgres-standby.service" OR "pve-config-backup.service" \
    OR "hindsight-bank-export.service" OR "llamaindex-index.service" \
    OR "llamaindex-agent-sessions.service" OR "object-storage-offsite@" \
    OR "openbao-secret-age.service")
iseval = false

[homelab_weekly_backup_units]
definition = ("restic-check@" OR "nautobot-check@" OR "homebox-check@" \
    OR "pgbackrest-backup@full.service" OR "hindsight-bank-dr-drill.service")
iseval = false

[homelab_backup_units]
definition = (`homelab_daily_backup_units` OR `homelab_weekly_backup_units`)
iseval = false

