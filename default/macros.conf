[homelab_index_silence(2)]
args = index, minutes
definition = tstats count as event_count max(_time) as last_seen WHERE index=$index$ \
    | stats sum(event_count) as event_count max(last_seen) as last_seen \
    | eval event_count=coalesce(event_count, 0), threshold_minutes=$minutes$, minutes_silent=(now()-coalesce(last_seen, 0))/60 \
    | where minutes_silent > threshold_minutes
iseval = false

[homelab_host_silence(2)]
args = index, minutes
definition = tstats count as event_count min(_time) as first_seen max(_time) as last_seen WHERE index=$index$ BY host \
    | appendpipe [ stats count as reporting_hosts | where reporting_hosts=0 | eval host="(no hosts reporting)", event_count=0, first_seen=0, last_seen=0 | fields - reporting_hosts ] \
    | eval avg_gap_minutes=if(event_count>1, (last_seen-first_seen)/60/(event_count-1), 0) \
    | eval host_threshold_minutes=max(avg_gap_minutes*`homelab_silence_cadence_multiplier`, $minutes$), minutes_silent=(now()-last_seen)/60 \
    | where minutes_silent > host_threshold_minutes
iseval = false

[homelab_os_log_indexes]
definition = (index=os OR index=os_proxmox OR index=os_ai)
iseval = false

# Backup systemd units, defined once by cadence. Every backup alert uses these
# shared families so an added unit is checked for both failures and silence.
[homelab_daily_backup_units]
definition = ("restic-backup@" OR "nautobot-backup@" OR "homebox-backup@" \
    OR "pg-backup.service" OR "pgbackrest-backup@incr.service" \
    OR "postgres-standby.service" OR "pve-config-backup.service" \
    OR "hindsight-bank-export.service" OR "llamaindex-index.service" \
    OR "llamaindex-agent-sessions.service" OR "object-storage-offsite@" \
    OR "openbao-secret-age.service")
iseval = false

[homelab_weekly_backup_units]
definition = ("restic-check@" OR "nautobot-check@" OR "homebox-check@" \
    OR "pgbackrest-backup@full.service" OR "hindsight-bank-dr-drill.service")
iseval = false

[homelab_backup_units]
definition = (`homelab_daily_backup_units` OR `homelab_weekly_backup_units`)
iseval = false

[homelab_silence_cadence_multiplier]
definition = 4
iseval = false

[homelab_backend_burst_threshold]
definition = 5
iseval = false

# Generic error terms, defined once. Every error-volume search uses this
# macro instead of its own keyword list.
[homelab_error_terms]
definition = (ERROR OR WARN OR WARNING OR CRITICAL OR FATAL OR EXCEPTION OR Traceback OR FAILED OR FAILURE OR TRUNCATED)
iseval = false

[homelab_database_connection_terms]
definition = (database OR postgresql OR postgres OR sqlalchemy OR psycopg OR mysql OR redis) \
    (connect OR connection OR refused OR unreachable OR timeout OR reach)
iseval = false

# PVE task log events keep the UPID in the forwarded file name. Keep the
# unavoidable extraction in one macro shared by the task outcome searches.
[homelab_pve_task_fields]
definition = rex field=_raw "(?<upid>UPID:[^\s]+)" \
    | rex field=upid "^UPID:(?<node>[^:]+):[^:]+:[^:]+:[^:]+:(?<task_type>[^:]+):(?<task_id>[^:]*):"
iseval = false

# Set to a quoted comma-separated list only when vzdump jobs are enabled.
# The empty quoted value produces no rows in the missed-run search.
# PBS status lines: "<ts> <host> pbs <job> <class> <outcome> <age_seconds>".
[homelab_pbs_status_fields]
definition = rex field=_raw "pbs-status:\s+\S+\s+\S+\s+pbs\s+(?<job>\S+)\s+(?<class>\S+)\s+(?<outcome>\S+)\s+(?<age_seconds>-?\d+)"
iseval = false

[homelab_vzdump_expected_nodes]
definition = ""
iseval = false

[homelab_pbs_daily_stale_seconds]
definition = 93600
iseval = false

[homelab_pbs_weekly_stale_seconds]
definition = 691200
iseval = false

