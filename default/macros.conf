[homelab_index_silence(2)]
args = index, minutes
definition = tstats count as event_count max(_time) as last_seen WHERE index=$index$ \
    | stats sum(event_count) as event_count max(last_seen) as last_seen \
    | eval event_count=coalesce(event_count, 0), threshold_minutes=$minutes$, minutes_silent=(now()-coalesce(last_seen, 0))/60 \
    | where minutes_silent > threshold_minutes
iseval = false

[homelab_host_silence(2)]
args = index, minutes
definition = tstats count as event_count min(_time) as first_seen max(_time) as last_seen WHERE index=$index$ BY host \
    | appendpipe [ stats count as reporting_hosts | where reporting_hosts=0 | eval host="(no hosts reporting)", event_count=0, first_seen=0, last_seen=0 | fields - reporting_hosts ] \
    | eval avg_gap_minutes=if(event_count>1, (last_seen-first_seen)/60/(event_count-1), 0) \
    | eval host_threshold_minutes=max(avg_gap_minutes*`homelab_silence_cadence_multiplier`, $minutes$), minutes_silent=(now()-last_seen)/60 \
    | where minutes_silent > host_threshold_minutes
iseval = false

[homelab_silence_cadence_multiplier]
definition = 4
iseval = false

[homelab_backend_burst_threshold]
definition = 5
iseval = false
