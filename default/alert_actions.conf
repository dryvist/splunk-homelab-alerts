# Every parameter is declared here with an empty default, mirroring the vendor
# add-ons: this stanza is the action's contract, and savedsearches.conf's
# [default] stanza supplies the real values. Declaring them keeps the setup UI
# and `sendalert` in agreement about which params exist.
#
# No `command = sendalert ...` line: Splunk generates it for is_custom = 1.
# Reading a vendor stanza back over REST shows one because Splunk filled it in,
# not because the app shipped it.
#
# No icon_path either, until there is an actual appIcon.png to point at -- a
# dangling icon reference renders as a broken image in the alert-action picker.
[zammad]
is_custom = 1
label = Zammad Incident
description = Creates a Zammad incident, or appends to the open one with the same correlation key
payload_format = json
python.version = python3
param.url =
param.group =
param.priority =
param.state =
param.correlation_key =
